# Testler PostgreSQL/RabbitMQ olmadan çalışsın diye H2 ve kapalı listener.
spring:
  datasource:
    url: jdbc:h2:mem:products;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
